services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - data:/var/lib/postgresql
    networks:
      - storage
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ledger", "-d", "ledger"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://ledger:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/ledger
      APP_USERNAME: ${APP_USERNAME:?Set APP_USERNAME}
      APP_PASSWORD_HASH: ${APP_PASSWORD_HASH:?Set APP_PASSWORD_HASH}
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN}
    expose:
      - "3000"
    networks:
      - storage
      - dokploy-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
networks:
  storage:
    internal: true
  dokploy-network:
    external: true
volumes:
  data:
