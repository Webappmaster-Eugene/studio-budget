services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ledger", "-d", "ledger"]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://ledger:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/ledger
      APP_USERNAME: ${APP_USERNAME:?Set APP_USERNAME}
      APP_PASSWORD_HASH: ${APP_PASSWORD_HASH:?Set APP_PASSWORD_HASH}
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:3212}
      PORT: ${APP_PORT:-3212}
    ports:
      - "127.0.0.1:${APP_PORT:-3212}:${APP_PORT:-3212}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  data:
